[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brainduck"
version = "0.2.0"
description = "A high-level language that compiles to Brainfuck"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "prockofiev" },
]
keywords = ["brainfuck", "compiler", "language", "esolang"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Compilers",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
brainduck = "brainduck:main"

[tool.setuptools]
py-modules = [
    "brainduck",
    "brainfuck",
    "compile",
    "debug",
    "help_output",
    "methods",
    "render_code",
    "variables",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"